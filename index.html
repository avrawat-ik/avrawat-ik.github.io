<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome</title>
<meta name="description" content="Resources shared after Interview Kickstart sessions.">
<style>
  :root {
    --navy: #0a1f44; --blue: #3994D1; --blue-dark: #2A7AB0; --blue-soft: #EAF3FB;
    --ink: #1f2a3d; --ink-soft: #4a5568; --hair: #e3e8ef; --bg: #ffffff; --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --navy: #e6edf7; --ink: #dbe3ee; --ink-soft: #a6b3c4; --hair: #273449; --bg: #0d1524; --card: #121c2e; --blue-soft: #13233a;
    }
  }
  :root[data-theme="dark"] {
    --navy: #e6edf7; --ink: #dbe3ee; --ink-soft: #a6b3c4; --hair: #273449; --bg: #0d1524; --card: #121c2e; --blue-soft: #13233a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 80px 16px; }
  h1 { color: var(--navy); font-size: 44px; letter-spacing: -0.02em; margin: 0 0 8px; }
  .lead { color: var(--ink-soft); font-size: 19px; margin: 0 0 40px; }
  h2 { color: var(--navy); font: 600 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase; margin: 0 0 12px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  a.item { display: block; text-decoration: none; border: 1px solid var(--hair); border-radius: 12px; padding: 16px 20px; background: var(--card); color: var(--ink); }
  a.item:hover { border-color: var(--blue); background: var(--blue-soft); }
  a.item b { display: block; color: var(--blue-dark); font-size: 18px; }
  a.item span { color: var(--ink-soft); font-size: 15.5px; }
</style>
</head>
<body>
<main>
  <h1>Welcome</h1>
  <p class="lead">Resources I share after sessions. More will be added here over time.</p>
  <h2>Resources</h2>
  <ul>
    <li>
      <a class="item" href="/portfolio-next-steps/">
        <b>Take your portfolio further</b>
        <span>After the "Build Your AI-Powered Portfolio" masterclass: example portfolios, a domain × AI project picker, eight upgrades with prompts, and a checklist.</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
